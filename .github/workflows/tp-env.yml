name: Env, Inputs and Outputs Lab
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        required: true
        type: choice
        options: [dev, staging, prod]
      version:
        description: Version à déployer
        type: string
        default: "1.0.0"
      debug:
        description: Afficher les informations de debug
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set environment variables
        run: |
          echo "APP_NAME=my-app" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"
          echo "APP_NAME in this step=<$APP_NAME>"
      - name: Print environment variables
        run: echo "Application $APP_NAME built on $BUILD_DATE"
      - name: Print deployment inputs
        env:
          TARGET_ENV: ${{ inputs.environment }}
          DEPLOY_VERSION: ${{ inputs.version }}
        run: echo "Environment=$TARGET_ENV Version=$DEPLOY_VERSION"
      - name: Print debug information
        if: ${{ inputs.debug }}
        run: echo "Debug enabled on $RUNNER_OS"
      - name: Compute full version
        id: version
        env:
          DEPLOY_VERSION: ${{ inputs.version }}
        run: |
          full_version="$DEPLOY_VERSION-$(date +%F)"
          echo "full_version=$full_version" >> "$GITHUB_OUTPUT"
          echo "full_version=$full_version"

  verify-env:
    runs-on: ubuntu-latest
    steps:
      - name: Print APP_NAME
        run: echo "APP_NAME=<$APP_NAME>"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Show deployment target
        env:
          FULL_VERSION: ${{ needs.build.outputs.full_version }}
          TARGET_ENV: ${{ inputs.environment }}
        run: echo "Deploying $FULL_VERSION to $TARGET_ENV"

  call-greeting:
    uses: ./.github/workflows/greeting.yml
    with:
      recipient: ${{ inputs.environment }}
