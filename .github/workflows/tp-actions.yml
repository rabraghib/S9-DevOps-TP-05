name: Third-Party and Custom Actions Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run build info action
        id: info
        uses: ./.github/actions/build-info
        with:
          app-name: my-app
      - name: Print build id
        env:
          BUILD_ID: ${{ steps.info.outputs.build-id }}
        run: printf 'Build id is %s\n' "$BUILD_ID"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Print Node.js version
        run: node --version
      - name: Generate build report
        run: printf 'Node.js %s | Date UTC %s\n' "$(node --version)" "$(date -u +%F)" > report.txt
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build report
        uses: actions/download-artifact@v4
        with:
          name: build-report
      - name: Print build report
        run: cat report.txt

  docker-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Docker hello action
        uses: ./.github/actions/docker-hello
        with:
          who: GitHub Actions
