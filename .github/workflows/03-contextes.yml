name: CI - Contextes
on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  lint:
    name: Lint – Ruff
    env:
      APP_NAME: fastapi-starter
    runs-on: ubuntu-latest
    steps:
      - name: Afficher les contextes
        env:
          APP: ${{ env.APP_NAME }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          OS: ${{ runner.os }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "APP_NAME=$APP"
          echo "actor=$ACTOR"
          echo "event_name=$EVENT"
          echo "ref=$REF"
          echo "sha=$SHA"
          echo "runner.os=$OS"
          echo "head_ref=$HEAD_REF"
          echo "base_ref=$BASE_REF"
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Vérifier le style
        run: ruff check .
  build:
    name: Build – Vérifier l’application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compiler le code
        run: python -m compileall app
      - name: Importer l’application
        run: python -c "from app.main import app; print(app.title)"
  test:
    name: Test – Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Exécuter les tests
        run: python -m pytest
